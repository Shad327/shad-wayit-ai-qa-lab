name: QA pipeline checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_noiselabz:
        description: Run the seven public NoiseLabz browser checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - run: python -m pytest tests -q --junitxml=ci-artifacts/python.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-report
          path: ci-artifacts/python.xml
          retention-days: 7

  noiselabz:
    if: github.event_name == 'workflow_dispatch' && inputs.run_noiselabz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test,browser]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest browser_tests/test_noiselabz.py -v --browser chromium --screenshot on --tracing on --output ci-artifacts/browser --junitxml ci-artifacts/browser.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noiselabz-evidence
          path: ci-artifacts/
          retention-days: 7


  java-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: selenium/selenium/pom.xml

      - name: Run public API tests
        working-directory: selenium/selenium
        run: mvn --batch-mode -Dtest=com.shadqa.tests.api.RecordedResultApiTest test

      - name: Upload API test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-api-report
          path: selenium/selenium/target/surefire-reports/
          retention-days: 7
